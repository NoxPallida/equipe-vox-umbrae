<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Cordon Bleu - Restaurant Gastronomique</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <section id="hero" class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 id="restaurant-name"></h1>
            <p id="restaurant-tagline" class="tagline"></p>
            <button id="reservation-btn" class="btn btn-primary">Réserver une table</button>
        </div>
    </section>

    <section id="menus" class="menus-section">
        <h2 class="section-title">Nos Menus</h2>
        <div class="menus-container">
            <div class="menus-list" id="menus-list">
            </div>
            <div class="menu-detail" id="menu-detail">
            </div>
        </div>
    </section>

    <section id="reservation" class="reservation-section">
        <h2 class="section-title">Réserver une Table</h2>
        <form id="reservation-form" class="reservation-form">
            <div class="form-group">
                <label for="couverts">Nombre de couverts *</label>
                <input type="number" id="couverts" name="couverts" min="1" max="50" placeholder="Nombre de personnes">
                <span id="couverts-error" class="error-message"></span>
                <span id="couverts-warning" class="warning-message"></span>
            </div>

            <div class="form-group">
                <label for="date">Date *</label>
                <input type="date" id="date" name="date">
                <span id="date-error" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="creneau">Créneau horaire *</label>
                <select id="creneau" name="creneau" disabled>
                    <option value="">Sélectionnez un créneau</option>
                </select>
                <span id="creneau-error" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="commentaire">Commentaire (optionnel)</label>
                <textarea id="commentaire" name="commentaire" placeholder="Restrictions alimentaires, demandes spéciales..." maxlength="500"></textarea>
                <div class="char-counter">
                    <span id="char-count">0</span>/500 caractères
                </div>
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary">Confirmer la réservation</button>
        </form>

        <div id="confirmation-message" class="confirmation-message hidden">
            <h3>Réservation confirmée !</h3>
            <div id="reservation-recap" class="reservation-recap"></div>
            <p>Merci pour votre réservation. Nous vous attendons avec impatience.</p>
        </div>
    </section>

    <footer class="footer">
        <p>© <span id="current-year"></span> Le Cordon Bleu - Restaurant Gastronomique</p>
        <p>Adresse : 123 Rue de la Gastronomie, 75000 Paris</p>
        <p>Téléphone : 01 23 45 67 89</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
